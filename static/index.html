<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InternTrack</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .25rem; }
    .sub { opacity: .7; margin-top: 0; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .5rem; margin: 1.5rem 0; }
    input, select, button { padding: .5rem; font: inherit; }
    button { cursor: pointer; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #8884; }
    #msg { min-height: 1.5rem; font-weight: 600; }
    #msg.err { color: #d33; }
    #msg.ok { color: #2a9d4b; }
  </style>
</head>
<body>
  <h1>InternTrack</h1>
  <p class="sub">Staj ve iş başvurularını tek yerden takip et. API dokümanı: <a href="/docs">/docs</a></p>

  <form id="form">
    <input id="company" placeholder="Şirket" required>
    <input id="position" placeholder="Pozisyon" required>
    <input id="date" type="date" required>
    <button type="submit">Başvuru ekle</button>
  </form>

  <div id="msg"></div>

  <div class="bar">
    <h2>Başvurularım</h2>
    <select id="filter">
      <option value="">Tüm durumlar</option>
    </select>
  </div>

  <table>
    <thead><tr><th>#</th><th>Şirket</th><th>Pozisyon</th><th>Tarih</th><th>Durum</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const STATUSES = {
      basvuruldu: "Başvuruldu",
      mulakat: "Mülakat",
      reddedildi: "Reddedildi",
      kabul: "Kabul"
    };
    const msg = document.getElementById("msg");
    const rows = document.getElementById("rows");
    const filter = document.getElementById("filter");

    function show(text, type) {
      msg.textContent = text;
      msg.className = type || "";
    }

    for (const [value, label] of Object.entries(STATUSES)) {
      filter.add(new Option(label, value));
    }

    async function load() {
      const s = filter.value;
      const res = await fetch("/applications" + (s ? "?status=" + s : ""));
      const data = await res.json();
      rows.replaceChildren();
      if (data.length === 0) {
        const tr = rows.insertRow();
        const td = tr.insertCell();
        td.colSpan = 5;
        td.textContent = "Kayıt yok.";
        return;
      }
      for (const app of data) {
        const tr = rows.insertRow();
        tr.insertCell().textContent = app.id;
        tr.insertCell().textContent = app.company;
        tr.insertCell().textContent = app.position;
        tr.insertCell().textContent = app.applied_date;
        const select = document.createElement("select");
        for (const [value, label] of Object.entries(STATUSES)) {
          select.add(new Option(label, value, false, value === app.status));
        }
        select.addEventListener("change", () => updateStatus(app.id, select.value));
        tr.insertCell().appendChild(select);
      }
    }

    async function updateStatus(id, status) {
      const res = await fetch(`/applications/${id}/status`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status })
      });
      if (res.ok) { show("Durum güncellendi.", "ok"); }
      else { show("Durum güncellenemedi (" + res.status + ").", "err"); }
      load();
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch("/applications", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          company: document.getElementById("company").value,
          position: document.getElementById("position").value,
          applied_date: document.getElementById("date").value
        })
      });
      if (res.status === 201) {
        show("Başvuru eklendi.", "ok");
        e.target.reset();
        load();
      } else {
        show("Başvuru eklenemedi (" + res.status + "). Alanları kontrol edin.", "err");
      }
    });

    filter.addEventListener("change", load);
    load();
  </script>
</body>
</html>
